// PlateWise for Wear OS (Pixel Watch). Built with the phone app; see plugins/withWearModule.js.
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "app.platewise.wear"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        // Same package as the phone app: the Wear OS Data Layer only connects apps that share it.
        applicationId "app.platewise.mobile"
        minSdk 30 // Wear OS 3+ (every Pixel Watch)
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.2.0"
    }

    signingConfigs {
        // Must match the phone app's signing key for the Data Layer to pair them.
        debug {
            storeFile file("../android/app/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.wear:wear:1.3.0"
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "androidx.wear.protolayout:protolayout-material:1.2.1"
    implementation "androidx.concurrent:concurrent-futures:1.2.0"
    implementation "com.google.guava:guava:33.3.1-android"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.wear.watchface:watchface-complications-data-source:1.2.1"
}
