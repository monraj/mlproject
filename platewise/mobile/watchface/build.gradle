// The PlateWise watch face (Watch Face Format: resources only, no code). Built with the phone app;
// see plugins/withWearModule.js. Its shortcuts come from the watch app's complications.
apply plugin: "com.android.application"

android {
    namespace "app.platewise.watchface"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.platewise.mobile.watchface"
        minSdk 33 // Watch Face Format needs Wear OS 4+
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file("../android/app/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
