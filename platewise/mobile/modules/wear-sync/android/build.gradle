plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.platewise'
version = '0.1.0'

android {
  namespace "expo.modules.wearsync"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Wear OS Data Layer: phone <-> watch sync over Bluetooth / Wi-Fi.
  implementation "com.google.android.gms:play-services-wearable:19.0.0"
}
