<title>Food Calorie Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column on phones, two columns (log | summary) on wide screens; summary first. */
:root {
  --bg: #f2f5f0;
  --surface: #ffffff;
  --ink: #18241c;
  --muted: #5d6b61;
  --line: #dbe3d8;
  --leaf: #2f7d4f;
  --leaf-soft: #e1efe4;
  --over: #b8432f;
  --protein: #8a4fb0;
  --carbs: #c98a12;
  --fat: #2a8c9a;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --surface: #19221c; --ink: #e6eee7; --muted: #9aab9f; --line: #2c3a30;
    --leaf: #5cbf83; --leaf-soft: #20352862; --over: #ee7a63;
    --protein: #b98ad8; --carbs: #e5b04a; --fat: #5ab9c6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --surface: #19221c; --ink: #e6eee7; --muted: #9aab9f; --line: #2c3a30;
  --leaf: #5cbf83; --leaf-soft: #20352862; --over: #ee7a63;
  --protein: #b98ad8; --carbs: #e5b04a; --fat: #5ab9c6; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font: 800 clamp(28px, 6vw, 40px)/1 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 600 18px/1.2 var(--font-display); margin: 0; }
.status { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.datenav { display: flex; align-items: center; gap: 6px; }
.datenav strong { min-width: 150px; text-align: center; font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.link-btn { border: 0; background: none; color: var(--leaf); font-weight: 600; padding: 4px 6px; }
.grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: start; } .side { position: sticky; top: 16px; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.side { display: grid; gap: 20px; min-width: 0; }

/* summary */
.summary { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.ring { width: 132px; height: 132px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font: 600 26px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.ring .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.ring.over .big { color: var(--over); }
.kv { display: grid; gap: 4px; font-size: 14px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; }
.kv span:last-child, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.macros { display: grid; gap: 10px; }
.macro { display: grid; gap: 4px; }
.macro .top { display: flex; justify-content: space-between; font-size: 13px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

/* add form */
form { display: grid; gap: 10px; }
.row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-transform: none; letter-spacing: 0; }
.search { position: relative; }
.suggest { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-height: 260px; overflow-y: auto; box-shadow: 0 10px 30px rgb(0 0 0 / 0.14); padding: 4px; margin: 0; list-style: none; }
.suggest li { padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.suggest li small { color: var(--muted); white-space: nowrap; font-family: var(--font-data); font-size: 12px; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--leaf-soft); }
.preview { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.primary { background: var(--leaf); color: #fff; border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; }
.primary:disabled { opacity: 0.5; cursor: default; }
.tabs { display: flex; gap: 6px; }
.tabs button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* meals */
.meal { display: grid; gap: 6px; }
.meal-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.meal-head span { font-family: var(--font-data); font-size: 13px; color: var(--muted); }
.entries { list-style: none; margin: 0; padding: 0; display: grid; }
.entries li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 0; }
.entries li + li { border-top: 1px dashed var(--line); }
.entries .name { min-width: 0; overflow-wrap: anywhere; }
.entries .name small { display: block; color: var(--muted); font-size: 12px; }
.entries .kcal { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.del { border: 0; background: none; color: var(--muted); width: 28px; height: 28px; border-radius: 50%; font-size: 16px; }
.del:hover { background: var(--leaf-soft); color: var(--over); }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0; margin: 0; }

/* week chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font-body); }
.chart .val { fill: var(--ink); font: 500 10px var(--font-data); }
.goal-row { display: flex; gap: 10px; align-items: end; }
.goal-row label { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .ring circle, .bar i { transition: stroke-dashoffset .4s ease, width .4s ease; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Food Calorie Tracker</h1>
      <div class="status" id="status">Loading your log…</div>
    </div>
    <div class="datenav">
      <button class="icon-btn" id="prevDay" aria-label="Previous day">‹</button>
      <strong id="dateLabel">Today</strong>
      <button class="icon-btn" id="nextDay" aria-label="Next day">›</button>
      <button class="link-btn" id="todayBtn" hidden>Today</button>
    </div>
  </header>

  <div class="grid">
    <div class="side" id="sideCol">
      <section class="panel" aria-label="Today's summary">
        <div class="summary">
          <div class="ring" id="ring">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"></circle>
              <circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="var(--leaf)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="326.73"></circle>
            </svg>
            <div class="center"><div class="big" id="remaining">0</div><div class="lbl" id="remainingLbl">kcal left</div></div>
          </div>
          <div class="kv">
            <div><span>Goal</span><span id="goalVal">0</span></div>
            <div><span>Eaten</span><span id="eatenVal">0</span></div>
            <div><span>Items logged</span><span id="countVal">0</span></div>
          </div>
        </div>
        <div class="macros" id="macros"></div>
        <p class="hint">Macro targets split your goal 25% protein, 50% carbs, 25% fat. Protein and carbs give 4 kcal per gram, fat gives 9.</p>
      </section>

      <section class="panel chart" aria-label="Last 7 days">
        <h2>Last 7 days</h2>
        <div id="chart"></div>
      </section>

      <section class="panel">
        <h2>Daily goal</h2>
        <form id="goalForm" class="goal-row">
          <label for="goalInput">Calories per day
            <input id="goalInput" type="number" min="800" max="6000" step="50" inputmode="numeric" required>
          </label>
          <button class="primary" type="submit" id="goalSave">Save goal</button>
        </form>
      </section>
    </div>

    <div class="side" id="mainCol" style="position:static">
      <section class="panel" aria-label="Add food">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <h2>Add food</h2>
          <div class="tabs" role="group" aria-label="Entry type">
            <button type="button" id="tabSearch" aria-pressed="true">Search foods</button>
            <button type="button" id="tabCustom" aria-pressed="false">Custom</button>
          </div>
        </div>
        <form id="addForm" autocomplete="off">
          <div id="searchFields" class="row" style="grid-template-columns:minmax(0,2fr) minmax(80px,0.7fr)">
            <label for="foodSearch" class="search">Food
              <input id="foodSearch" type="text" placeholder="Try “banana” or “rice”" role="combobox" aria-expanded="false" aria-controls="suggest">
              <ul class="suggest" id="suggest" role="listbox" hidden></ul>
            </label>
            <label for="servings">Servings
              <input id="servings" type="number" min="0.25" step="0.25" value="1" inputmode="decimal">
            </label>
          </div>
          <div id="customFields" hidden>
            <div class="row">
              <label for="cName" style="grid-column:1/-1">Food name
                <input id="cName" type="text" placeholder="Mom's lasagna">
              </label>
            </div>
            <div class="row" style="margin-top:10px">
              <label for="cKcal">Calories<input id="cKcal" type="number" min="0" inputmode="numeric"></label>
              <label for="cP">Protein g<input id="cP" type="number" min="0" step="0.1" inputmode="decimal"></label>
              <label for="cC">Carbs g<input id="cC" type="number" min="0" step="0.1" inputmode="decimal"></label>
              <label for="cF">Fat g<input id="cF" type="number" min="0" step="0.1" inputmode="decimal"></label>
            </div>
          </div>
          <div class="row">
            <label for="meal">Meal
              <select id="meal">
                <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option>
              </select>
            </label>
          </div>
          <div class="preview" id="preview" aria-live="polite"></div>
          <button class="primary" type="submit" id="addBtn" disabled>Add to log</button>
        </form>
      </section>

      <section class="panel" aria-label="Food log" id="log"></section>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  // name, serving, kcal, protein g, carbs g, fat g
  const FOODS = [

    ["White bread", "1 slice (25 g)", 67, 2, 13, 0.8],
    ["Whole wheat bread", "1 slice (32 g)", 81, 4, 14, 1.1],
    ["Bagel, plain", "1 medium (105 g)", 277, 11, 55, 1.4],
    ["Flour tortilla", "1 medium (45 g)", 140, 3.7, 24, 3.5],
    ["Chapati / roti", "1 piece (40 g)", 120, 3.1, 18, 3.7],
    ["Naan", "1 piece (90 g)", 262, 8.7, 45, 5.1],
    ["Corn flakes", "1 cup (28 g)", 100, 2, 24, 0.1],
    ["Granola", "1/2 cup (61 g)", 290, 7, 38, 13],
    ["Egg, large", "1 egg (50 g)", 72, 6.3, 0.4, 4.8],
    ["Scrambled eggs", "2 eggs with butter", 200, 13, 2, 15],
    ["Chicken breast, grilled", "100 g", 165, 31, 0, 3.6],
    ["Chicken thigh, roasted", "100 g", 209, 26, 0, 11],
    ["Ground beef 85%, cooked", "100 g", 250, 26, 0, 15],
    ["Steak, sirloin", "100 g", 206, 29, 0, 9],
    ["Salmon, baked", "100 g", 206, 22, 0, 12],
    ["Tuna, canned in water", "1 can drained (142 g)", 179, 39, 0, 1.3],
    ["Shrimp, cooked", "100 g", 99, 24, 0.2, 0.3],
    ["Tofu, firm", "100 g", 144, 17, 3, 9],
    ["Lentils, cooked", "1 cup (198 g)", 230, 18, 40, 0.8],
    ["Chickpeas, cooked", "1 cup (164 g)", 269, 15, 45, 4.2],
    ["Black beans, cooked", "1 cup (172 g)", 227, 15, 41, 0.9],
    ["Dal (lentil curry)", "1 cup (240 g)", 260, 13, 34, 8],
    ["Hummus", "2 tbsp (30 g)", 70, 2, 4, 5],
    ["Milk, 2%", "1 cup (244 g)", 122, 8, 12, 4.8],
    ["Milk, whole", "1 cup (244 g)", 149, 8, 12, 8],
    ["Greek yogurt, plain nonfat", "170 g container", 100, 17, 6, 0.7],
    ["Yogurt, flavored", "150 g container", 140, 5, 24, 2.5],
    ["Cheddar cheese", "1 slice (28 g)", 113, 7, 0.4, 9.3],
    ["Mozzarella", "28 g", 85, 6.3, 0.7, 6.3],
    ["Cottage cheese, 2%", "1/2 cup (113 g)", 92, 12, 5, 2.6],
    ["Butter", "1 tbsp (14 g)", 102, 0.1, 0, 11.5],
    ["Olive oil", "1 tbsp (14 g)", 119, 0, 0, 13.5],
    ["Peanut butter", "2 tbsp (32 g)", 188, 8, 6, 16],
    ["Almonds", "1 oz (28 g, ~23 nuts)", 164, 6, 6, 14],
    ["Walnuts", "1 oz (28 g)", 185, 4.3, 3.9, 18.5],
    ["Protein shake (whey)", "1 scoop in water", 120, 24, 3, 1.5],
    ["Pizza, cheese", "1 slice (107 g)", 285, 12, 36, 10],
    ["Hamburger", "1 single patty with bun", 354, 20, 29, 17],
    ["Cheeseburger", "1 single patty with bun", 403, 22, 31, 21],
    ["Burrito, bean & cheese", "1 burrito (200 g)", 380, 14, 52, 12],
    ["Chicken curry", "1 cup (240 g)", 290, 24, 9, 18],
    ["Fried rice", "1 cup (198 g)", 238, 5.5, 34, 9],
    ["Sushi roll, California", "6 pieces", 255, 7, 38, 7],
    ["Caesar salad", "1 bowl (200 g)", 330, 8, 12, 28],
    ["Turkey sandwich", "1 sandwich", 320, 22, 36, 9],
    ["Potato chips", "1 oz (28 g)", 152, 2, 15, 10],
    ["Dark chocolate 70%", "1 oz (28 g)", 170, 2.2, 13, 12],
    ["Chocolate chip cookie", "1 medium (30 g)", 142, 1.6, 19, 7],
    ["Ice cream, vanilla", "1/2 cup (66 g)", 137, 2.3, 16, 7.3],
    ["Donut, glazed", "1 medium (64 g)", 269, 4, 31, 15],
    ["Coffee, black", "1 cup (240 ml)", 2, 0.3, 0, 0],
    ["Latte, 2% milk", "16 oz (473 ml)", 190, 13, 18, 7],
    ["Orange juice", "1 cup (248 ml)", 112, 1.7, 26, 0.5],
    ["Cola", "1 can (355 ml)", 140, 0, 39, 0],
    ["Beer", "1 can (355 ml)", 153, 1.6, 13, 0],
    ["Red wine", "1 glass (150 ml)", 125, 0.1, 3.8, 0],
    ["Honey", "1 tbsp (21 g)", 64, 0.1, 17, 0],
    ["Sugar", "1 tsp (4 g)", 16, 0, 4, 0],
  ].map(([name, serving, kcal, p, c, f]) => ({ name, serving, kcal, p, c, f }));

  const MEALS = ["Breakfast", "Lunch", "Dinner", "Snacks"];
  const DEFAULT_GOAL = 2000;
  const LOCAL_KEY = "food-calorie-tracker-v1";
  const $ = (id) => document.getElementById(id);

  const state = { days: {}, goal: DEFAULT_GOAL, date: todayKey(), ready: false, mode: "loading" };
  let store = null;

  function todayKey(d = new Date()) {
    const z = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
  }
  function shiftKey(key, by) {
    const [y, m, d] = key.split("-").map(Number);
    return todayKey(new Date(y, m - 1, d + by));
  }
  function keyToDate(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); }
  const round = (n) => Math.round(n);
  const r1 = (n) => Math.round(n * 10) / 10;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- storage ----------
  function localStore() {
    let data = { days: {}, goal: DEFAULT_GOAL };
    try { data = Object.assign(data, JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}")); } catch (e) {}
    const persist = () => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ days: state.days, goal: state.goal })); } catch (e) {} };
    return {
      mode: "local",
      start(onLoad) { onLoad(data.days || {}, data.goal || DEFAULT_GOAL); },
      async saveDay() { persist(); },
      async saveGoal() { persist(); },
    };
  }

  function dbStore(db, userId) {
    const col = db.collection("data/users/" + userId);
    const chains = {};
    // One write at a time per document.
    const queue = (id, fn) => (chains[id] = (chains[id] || Promise.resolve()).catch(() => {}).then(fn));
    return {
      mode: "db",
      start(onLoad) {
        col.onSnapshot((snap) => {
          const days = {}; let goal = DEFAULT_GOAL;
          for (const doc of snap.docs) {
            const body = doc.data() || {};
            if (doc.id === "settings") goal = Number(body.goal) || DEFAULT_GOAL;
            else if (doc.id.startsWith("d")) days[doc.id.slice(1)] = Array.isArray(body.entries) ? body.entries : [];
          }
          onLoad(days, goal);
        }, (err) => { setStatus("Sync stopped. Reload the page to reconnect."); console.warn(err); });
      },
      saveDay(key, entries) {
        const ref = col.doc("d" + key);
        return queue(ref.path, () => entries.length ? ref.set({ date: key, entries }) : ref.delete());
      },
      saveGoal(goal) {
        const ref = col.doc("settings");
        return queue(ref.path, () => ref.set({ goal }));
      },
    };
  }

  async function connect() {
    let db = null, user = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
    }
    let userId = null;
    if (db && user) { try { userId = await user.id(); } catch (e) {} }
    store = db && userId ? dbStore(db, userId) : localStore();
    state.mode = store.mode;
    store.start((days, goal) => {
      state.days = days; state.goal = goal; state.ready = true;
      setStatus(store.mode === "db" ? "Synced to your Claude account" : "Saved on this device");
      render();
    });
  }

  function setStatus(t) { $("status").textContent = t; }
  function persistError(e) {
    console.warn(e);
    const code = e && e.code;
    toast(code === "quota_exceeded" ? "Storage is full. Delete some old entries." : "Couldn't save. Check your connection and try again.");
  }

  // ---------- derived ----------
  const entriesFor = (key) => state.days[key] || [];
  function totals(entries) {
    return entries.reduce((t, e) => ({ kcal: t.kcal + e.kcal, p: t.p + e.p, c: t.c + e.c, f: t.f + e.f }), { kcal: 0, p: 0, c: 0, f: 0 });
  }

  // ---------- render ----------
  function render() {
    renderDate(); renderSummary(); renderLog(); renderChart();
    if (document.activeElement !== $("goalInput")) $("goalInput").value = state.goal;
    updatePreview();
  }

  function renderDate() {
    const t = todayKey();
    const d = keyToDate(state.date);
    const label = state.date === t ? "Today" : state.date === shiftKey(t, -1) ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "short" });
    $("dateLabel").textContent = `${label}, ${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
    $("nextDay").disabled = state.date >= t;
    $("nextDay").style.opacity = state.date >= t ? 0.35 : 1;
    $("todayBtn").hidden = state.date === t;
  }

  function renderSummary() {
    const entries = entriesFor(state.date);
    const t = totals(entries);
    const left = state.goal - t.kcal;
    const pct = Math.min(t.kcal / state.goal, 1);
    const C = 2 * Math.PI * 52;
    const arc = $("ringArc");
    arc.setAttribute("stroke-dashoffset", String(C * (1 - pct)));
    arc.setAttribute("stroke", left < 0 ? "var(--over)" : "var(--leaf)");
    $("ring").classList.toggle("over", left < 0);
    $("remaining").textContent = Math.abs(round(left)).toLocaleString();
    $("remainingLbl").textContent = left < 0 ? "kcal over" : "kcal left";
    $("goalVal").textContent = state.goal.toLocaleString() + " kcal";
    $("eatenVal").textContent = round(t.kcal).toLocaleString() + " kcal";
    $("countVal").textContent = entries.length;

    const targets = { p: state.goal * 0.25 / 4, c: state.goal * 0.5 / 4, f: state.goal * 0.25 / 9 };
    const rows = [["Protein", "p", "--protein"], ["Carbs", "c", "--carbs"], ["Fat", "f", "--fat"]];
    $("macros").innerHTML = rows.map(([label, k, color]) => {
      const w = Math.min(t[k] / targets[k], 1) * 100;
      return `<div class="macro"><div class="top"><span>${label}</span><span class="num">${round(t[k])} / ${round(targets[k])} g</span></div>
        <div class="bar"><i style="width:${w}%;background:var(${color})"></i></div></div>`;
    }).join("");
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }

  function renderLog() {
    const log = $("log");
    if (!state.ready) { log.innerHTML = `<h2>Food log</h2><p class="empty">Loading your log…</p>`; return; }
    const entries = entriesFor(state.date);
    const sections = MEALS.map((meal) => {
      const items = entries.filter((e) => e.meal === meal);
      const sum = round(items.reduce((s, e) => s + e.kcal, 0));
      const list = items.length
        ? `<ul class="entries">${items.map((e) => `
            <li><div class="name">${esc(e.name)}<small>${esc(e.qty)} · P ${r1(e.p)} · C ${r1(e.c)} · F ${r1(e.f)} g</small></div>
            <span class="kcal">${round(e.kcal)}</span>
            <button class="del" data-id="${esc(e.id)}" aria-label="Remove ${esc(e.name)}">×</button></li>`).join("")}</ul>`
        : `<p class="empty">Nothing logged for ${meal.toLowerCase()}.</p>`;
      return `<div class="meal"><div class="meal-head"><h2>${meal}</h2><span>${sum} kcal</span></div>${list}</div>`;
    }).join("");
    const intro = entries.length ? "" : `<p class="empty">Your log for this day is empty. Search for a food above, pick a serving size and meal, then press Add to log.</p>`;
    log.innerHTML = intro + sections;
  }

  function renderChart() {
    const W = 340, H = 170, top = 18, bottom = 28, left = 6, right = 6;
    const days = Array.from({ length: 7 }, (_, i) => shiftKey(state.date, i - 6));
    const vals = days.map((k) => totals(entriesFor(k)).kcal);
    const max = Math.max(state.goal * 1.15, ...vals, 1);
    const plotH = H - top - bottom;
    const y = (v) => top + plotH - (v / max) * plotH;
    const slot = (W - left - right) / 7, bw = slot * 0.56;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories eaten each of the last 7 days compared with your goal">`;
    s += `<line x1="${left}" x2="${W - right}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
    days.forEach((k, i) => {
      const v = vals[i], x = left + slot * i + (slot - bw) / 2;
      const fill = v > state.goal ? "var(--over)" : k === state.date ? "var(--leaf)" : "var(--leaf-soft)";
      const stroke = k === state.date || v > state.goal ? "none" : "var(--leaf)";
      if (v > 0) s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
      if (v > 0) s += `<text class="val" x="${x + bw / 2}" y="${y(v) - 4}" text-anchor="middle">${round(v)}</text>`;
      const lbl = keyToDate(k).toLocaleDateString(undefined, { weekday: "short" });
      s += `<text x="${x + bw / 2}" y="${H - 9}" text-anchor="middle"${k === state.date ? ' style="fill:var(--ink);font-weight:600"' : ""}>${lbl}</text>`;
    });
    s += `<line x1="${left}" x2="${W - right}" y1="${y(state.goal)}" y2="${y(state.goal)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity="0.55"/>`;
    s += `<text x="${W - right}" y="${y(state.goal) - 4}" text-anchor="end">goal ${state.goal}</text></svg>`;
    const logged = vals.filter((v) => v > 0);
    const avg = logged.length ? round(logged.reduce((a, b) => a + b, 0) / logged.length) : 0;
    s += `<p class="hint">${logged.length ? `Average ${avg.toLocaleString()} kcal over ${logged.length} logged day${logged.length > 1 ? "s" : ""}.` : "Bars appear here as you log days."}</p>`;
    $("chart").innerHTML = s;
  }

  // ---------- add food ----------
  let mode = "search", picked = null, activeIdx = -1, matches = [];

  function setMode(m) {
    mode = m;
    $("tabSearch").setAttribute("aria-pressed", m === "search");
    $("tabCustom").setAttribute("aria-pressed", m === "custom");
    $("customFields").hidden = m !== "custom";
    $("searchFields").hidden = m !== "search";
    updatePreview();
  }

  function search(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    const words = q.split(/\s+/);
    return FOODS.filter((f) => words.every((w) => f.name.toLowerCase().includes(w)))
      .sort((a, b) => a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q))
      .slice(0, 8);
  }

  function showSuggest() {
    const ul = $("suggest");
    if (!matches.length) {
      const q = $("foodSearch").value.trim();
      ul.innerHTML = q ? `<li aria-disabled="true">No match. Use the Custom tab to enter “${esc(q)}”.</li>` : "";
      ul.hidden = !q; $("foodSearch").setAttribute("aria-expanded", String(!!q)); return;
    }
    ul.innerHTML = matches.map((f, i) => `<li role="option" data-i="${i}" aria-selected="${i === activeIdx}"><span>${esc(f.name)}</span><small>${f.kcal} kcal · ${esc(f.serving)}</small></li>`).join("");
    ul.hidden = false; $("foodSearch").setAttribute("aria-expanded", "true");
  }
  function hideSuggest() { $("suggest").hidden = true; $("foodSearch").setAttribute("aria-expanded", "false"); }

  function pick(f) {
    picked = f; $("foodSearch").value = f.name; hideSuggest(); updatePreview(); $("servings").focus();
  }

  function currentEntry() {
    if (mode === "search") {
      const n = parseFloat($("servings").value);
      if (!picked || !(n > 0)) return null;
      return { name: picked.name, qty: `${n} × ${picked.serving}`, kcal: picked.kcal * n, p: picked.p * n, c: picked.c * n, f: picked.f * n };
    }
    const name = $("cName").value.trim();
    const kcal = parseFloat($("cKcal").value);
    if (!name || !(kcal >= 0)) return null;
    const num = (id) => Math.max(parseFloat($(id).value) || 0, 0);
    return { name, qty: "custom", kcal, p: num("cP"), c: num("cC"), f: num("cF") };
  }

  function updatePreview() {
    const e = currentEntry();
    $("addBtn").disabled = !e || !state.ready;
    $("preview").textContent = e ? `${round(e.kcal)} kcal · P ${r1(e.p)} g · C ${r1(e.c)} g · F ${r1(e.f)} g` :
      mode === "search" ? "Pick a food from the list to see its calories." : "Enter a name and calories. Macros are optional.";
  }

  function defaultMeal() {
    const h = new Date().getHours();
    return h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 21 ? "Dinner" : "Snacks";
  }

  async function saveDay(key, entries) {
    state.days = { ...state.days, [key]: entries };
    render();
    try { await store.saveDay(key, entries); } catch (e) { persistError(e); }
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200);
  }

  // ---------- events ----------
  $("foodSearch").addEventListener("input", (e) => {
    picked = null; matches = search(e.target.value); activeIdx = matches.length ? 0 : -1; showSuggest(); updatePreview();
  });
  $("foodSearch").addEventListener("keydown", (e) => {
    if ($("suggest").hidden || !matches.length) return;
    if (e.key === "ArrowDown") { activeIdx = (activeIdx + 1) % matches.length; showSuggest(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { activeIdx = (activeIdx - 1 + matches.length) % matches.length; showSuggest(); e.preventDefault(); }
    else if (e.key === "Enter" && activeIdx >= 0) { pick(matches[activeIdx]); e.preventDefault(); }
    else if (e.key === "Escape") hideSuggest();
  });
  $("foodSearch").addEventListener("blur", () => setTimeout(hideSuggest, 150));
  $("suggest").addEventListener("mousedown", (e) => {
    const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); pick(matches[+li.dataset.i]); }
  });
  ["servings", "cName", "cKcal", "cP", "cC", "cF"].forEach((id) => $(id).addEventListener("input", updatePreview));
  $("tabSearch").addEventListener("click", () => setMode("search"));
  $("tabCustom").addEventListener("click", () => setMode("custom"));

  $("addForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const e = currentEntry(); if (!e || !state.ready) return;
    const entry = { id: uid(), meal: $("meal").value, ...e, kcal: r1(e.kcal), p: r1(e.p), c: r1(e.c), f: r1(e.f) };
    saveDay(state.date, [...entriesFor(state.date), entry]);
    toast(`Added ${entry.name} to ${entry.meal.toLowerCase()}`);
    if (mode === "search") { picked = null; $("foodSearch").value = ""; $("servings").value = 1; $("foodSearch").focus(); }
    else { ["cName", "cKcal", "cP", "cC", "cF"].forEach((id) => ($(id).value = "")); $("cName").focus(); }
    updatePreview();
  });

  $("log").addEventListener("click", (ev) => {
    const btn = ev.target.closest(".del"); if (!btn) return;
    const entries = entriesFor(state.date);
    const removed = entries.find((e) => e.id === btn.dataset.id);
    saveDay(state.date, entries.filter((e) => e.id !== btn.dataset.id));
    if (removed) toast(`Removed ${removed.name}`);
  });

  $("goalForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const g = Math.round(parseFloat($("goalInput").value));
    if (!(g >= 800 && g <= 6000) || !state.ready) return;
    state.goal = g; render(); toast(`Daily goal set to ${g.toLocaleString()} kcal`);
    try { await store.saveGoal(g); } catch (e) { persistError(e); }
  });

  $("prevDay").addEventListener("click", () => { state.date = shiftKey(state.date, -1); render(); });
  $("nextDay").addEventListener("click", () => { if (state.date < todayKey()) { state.date = shiftKey(state.date, 1); render(); } });
  $("todayBtn").addEventListener("click", () => { state.date = todayKey(); render(); });

  $("meal").value = defaultMeal();
  render();
  connect();
})();
</script>
