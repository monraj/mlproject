<style>
/* Layout: a single phone-width app column (max 520px), centred on wide screens, bottom tab bar fixed. Fresh mint style. */
:root {
  --bg: #ffffff;
  --surface: #f4f6f5;
  --line: #eaecf0;
  --ink: #101828;
  --muted: #475467;
  --mint: #12b76a;
  --mint-text: #027a48;
  --mint-tint: #ecfdf3;
  --sun: #fdb022;
  --amber-bg: #fffaeb;
  --amber: #f79009;
  --amber-text: #b54708;
  --danger: #d92d20;
  --on-ink: #ffffff;
  --water: #2e90fa;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111d; --surface: #161b26; --line: #263040; --ink: #f5f5f6; --muted: #a4adbd;
    --mint: #32d583; --mint-text: #6ce9a6; --mint-tint: #0f2a1e; --amber-bg: #2b1d08; --amber-text: #fec84b;
    --danger: #f97066; --on-ink: #0c111d; --water: #53b1fd; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111d; --surface: #161b26; --line: #263040; --ink: #f5f5f6; --muted: #a4adbd;
  --mint: #32d583; --mint-text: #6ce9a6; --mint-tint: #0f2a1e; --amber-bg: #2b1d08; --amber-text: #fec84b;
  --danger: #f97066; --on-ink: #0c111d; --water: #53b1fd; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
.stack { display: grid; gap: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 700; margin: 0; }
p { margin: 0; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; line-height: 1.45; }
.num { font-variant-numeric: tabular-nums; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -0.02em; }
.brand-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--mint); position: relative; }
.brand-dot::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--bg); }
.status { font-size: 11.5px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { min-height: 50px; padding: 0 22px; border-radius: 25px; border: 0; background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.full { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 19px; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.chip.long { white-space: normal; text-align: left; padding-block: 7px; max-width: 100%; }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.x-btn { width: 32px; height: 32px; border-radius: 16px; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; flex-shrink: 0; }
.x-btn:hover { background: var(--line); color: var(--danger); }
label.field { display: grid; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg); font-size: 15px; font-weight: 500; color: var(--ink);
}
textarea { min-height: 96px; resize: vertical; }
.grid2 { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid3 { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--mint-tint); color: var(--mint-text); }
.badge.check { background: var(--amber-bg); color: var(--amber-text); border: 1.5px solid var(--amber); }
.badge.plain { background: var(--line); color: var(--muted); }
.notice { padding: 12px 14px; border-radius: 16px; background: var(--amber-bg); color: var(--amber-text); font-size: 13.5px; line-height: 1.45; }
.good { padding: 12px 14px; border-radius: 16px; background: var(--mint-tint); color: var(--mint-text); font-size: 13.5px; line-height: 1.45; }
.err { color: var(--danger); font-size: 13.5px; font-weight: 600; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; }
.switch input { width: 22px; height: 22px; accent-color: var(--mint); flex-shrink: 0; }

/* today */
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.ring.over .big { color: var(--danger); }
.kv { display: grid; gap: 8px; }
.kv b { display: block; font-size: 18px; }
.habits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.habit { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 11px 12px; display: grid; gap: 7px; min-width: 0; }
.habit .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.habit b { font-size: 13px; }
.step { display: flex; gap: 4px; }
.step button { width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; padding: 0; line-height: 1; }
.habit input { min-height: 34px; padding: 4px 10px; font-size: 14px; border-radius: 10px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--mint); }
.meal { display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.meal-ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; font-weight: 800; font-size: 15px; color: var(--mint-text); background: var(--mint-tint); }
.meal .names { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.meal .kcal { font-weight: 700; white-space: nowrap; }
.add-tile { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 20px; border: 2px dashed var(--line); background: transparent; text-align: left; width: 100%; }
.date-nav { display: flex; align-items: center; gap: 6px; }
.remind { border-radius: 20px; padding: 14px; background: var(--ink); color: var(--on-ink); display: grid; gap: 10px; }
.remind .btn.sm { background: var(--bg); color: var(--ink); }
.remind .btn.sm.alt { background: transparent; color: var(--on-ink); border: 1px solid currentColor; }

/* log hub */
.hub { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hub button { display: grid; justify-items: center; gap: 6px; padding: 12px 6px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; text-align: center; }
.hub button[aria-pressed="true"] { border: 2px solid var(--ink); background: var(--bg); }
.hub svg { width: 24px; height: 24px; }
.drop { display: grid; place-items: center; gap: 8px; text-align: center; min-height: 200px; border-radius: 24px; border: 2px dashed var(--line); background: var(--surface); padding: 20px; cursor: pointer; position: relative; overflow: hidden; }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .cam { width: 64px; height: 64px; border-radius: 32px; background: var(--ink); display: grid; place-items: center; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.results button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); }
.results small { color: var(--muted); white-space: nowrap; }
.scanning { display: grid; place-items: center; gap: 14px; padding: 30px 10px; text-align: center; }
.spark { width: 70px; height: 70px; border-radius: 50%; border: 6px solid var(--line); border-top-color: var(--mint); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.mic { width: 84px; height: 84px; border-radius: 42px; border: 0; background: var(--ink); display: grid; place-items: center; justify-self: center; }
.mic.on { background: var(--danger); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--danger) 25%, transparent); } }

/* review */
.item { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 12px 14px; display: grid; gap: 8px; }
.item.low { border: 2px solid var(--amber); }
.item input[type=range] { width: 100%; accent-color: var(--mint); height: 28px; }
.item select { min-height: 38px; padding: 6px 10px; font-size: 13.5px; border-radius: 10px; }
.total { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.total .big { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
.suggest { list-style: none; margin: 4px 0 0; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); display: grid; }
.suggest button { text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; display: flex; justify-content: space-between; gap: 8px; }
.suggest button:hover { background: var(--surface); }
.suggest small { color: var(--muted); }
.insight { display: flex; gap: 12px; align-items: flex-start; }
.insight .dot { width: 34px; height: 34px; border-radius: 17px; flex-shrink: 0; display: grid; place-items: center; font-weight: 800; }

/* coach */
.chat { display: grid; gap: 10px; }
.bubble { max-width: 86%; padding: 11px 14px; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.bubble.me { justify-self: end; background: var(--mint-text); color: var(--bg); border-radius: 18px 18px 6px 18px; }
.bubble.ai { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 18px 6px; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer label { min-width: 0; }
.composer textarea { min-height: 50px; height: 50px; border-radius: 25px; padding: 13px 18px; resize: none; }
.idea { border-radius: 20px; border: 1px solid var(--line); background: var(--bg); padding: 14px; display: grid; gap: 10px; }
.idea.best { border: 2px solid var(--mint); }

/* progress */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 600 10.5px var(--font); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-size: 18px; letter-spacing: -0.02em; }
.list { display: grid; }
.list > div { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* glance */
.glance { border-radius: 28px; background: var(--surface); border: 1px solid var(--line); padding: 18px; display: grid; gap: 14px; }

/* tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 520px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; }
nav.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; min-width: 54px; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 4px; }
nav.tabs button[aria-current="page"] { color: var(--mint-text); font-weight: 700; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs .snap { width: 60px; height: 60px; border-radius: 30px; background: var(--ink); margin-top: -26px; display: grid; place-items: center; min-width: 0; }
nav.tabs .snap svg { stroke: var(--on-ink); }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--on-ink); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .ring circle, .bar i { transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1), width .5s cubic-bezier(.2,.8,.2,1); } }
@media (prefers-reduced-motion: reduce) { .spark, .mic.on { animation: none; } }
</style>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>PlateWise</div>
    <span class="status" id="status">Loading…</span>
  </div>
  <main id="view" aria-live="polite"><div class="card"><p class="muted">Loading your log…</p></div></main>
</div>

    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4-4 4 3 6-7"/></svg>Progress</button>
    <button data-tab="log" class="snap" aria-label="Log a meal"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button data-tab="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"/><path d="M9 10h6"/></svg>Coach</button>
    <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

  // ---------- energy maths ----------
  function plan(p, tdeeOverride) {

  function itemCalc(it, oil) {

DAILY BUDGET: ${pl.budget} kcal (safety floor ${pl.floor}); estimated burn ${r(pl.tdee)} kcal. Targets: protein ${pl.protein} g, carbs ${pl.carbs} g, fat ${pl.fat} g, greens ${TARGETS.greens} servings.

LAST 7 DAYS:
${days}
WEIGHT: ${tr.length ? `trend ${r1(tr[tr.length - 1].trend)} kg${wk != null ? `, ${wk > 0 ? "+" : ""}${r1(wk)} kg/week` : ""}` : "no weigh-ins yet"}.

  function coachRules() {
    return `You are PlateWise, a friendly nutrition coach inside a calorie and weight tracker used mainly in Ghana. Use the person's data below. Be warm, practical and brief (2-6 short sentences or a short list). Know Ghanaian food: chop bars, waakye, banku, kenkey, fufu, soups and stews, and suggest realistic local swaps (less oil on top, smaller ball, more kontomire or garden eggs, grilled not fried). Never shame food choices. You are not a doctor: for medical conditions, pregnancy, or signs of disordered eating, gently suggest seeing a health professional. Never recommend eating below the safety floor or losing more than 1% of body weight a week.${hide() ? " The person has turned on hide-numbers mode: do not mention calorie numbers; talk about portions and food choices instead." : ""}
${state.canTools ? "When the person asks to plan around an event (wedding, funeral, party, festival), call propose_flex_plan with lower budgets on a few days before and a higher budget on the event day, keeping the total for those days about the same as their normal budgets. Then explain the plan in one or two sentences; the app shows a Save button." : ""}

${coachContext()}`;

  const coachTurns = () => state.docs.coach?.turns || [];
  async function sendCoach(text) {
    const C = state.coach;
    if (!state.sample || C.busy || !text.trim()) return;
    const turns = [...coachTurns(), { role: "user", content: text.trim().slice(0, 2000) }].slice(-16);
    put("coach", { turns });
    C.busy = true; C.live = ""; C.error = ""; C.ctl = new AbortController();
    render(); scrollChat();
    const tools = state.canTools ? [{
      name: "propose_flex_plan",
      description: "Propose day-specific calorie budgets for upcoming days (for example eating a bit less before a wedding and more on the day). The app shows the plan to the person with a Save button; nothing changes until they tap it. Returns a confirmation string.",
      inputSchema: { type: "object", properties: { reason: { type: "string" }, days: { type: "array", items: { type: "object", properties: { date: { type: "string", description: "YYYY-MM-DD" }, kcal: { type: "number" } }, required: ["date", "kcal"] } } }, required: ["days"] },
      execute(input) {
        const pl = plan(profile()), today = dayKey();
        const days = (Array.isArray(input.days) ? input.days : []).map((d) => ({ date: String(d.date), kcal: r(Number(d.kcal)) }))
          .filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d.date) && d.date >= today && daysBetween(today, d.date) <= 21 && d.kcal > 0).slice(0, 10);
        if (!days.length) throw new Error("No valid upcoming dates (use YYYY-MM-DD within the next 3 weeks).");
        const low = days.find((d) => d.kcal < pl.floor);
        if (low) throw new Error(`${low.date} is below the ${pl.floor} kcal safety floor. Keep every day at or above it.`);
        C.pending = { reason: String(input.reason || "Flex plan").slice(0, 80), days };
        return "Shown to the person with a Save button.";
      },
    }] : undefined;
    try {
      const { text: answer } = await state.sample([{ role: "user", content: coachRules() }, ...turns], {
        cache: false, signal: C.ctl.signal, tools,
        onText: ({ text: t }) => { C.live = t; const el = $("#coachLive"); if (el) { el.innerHTML = md(t); scrollChat(); } },
      });
      put("coach", { turns: [...turns, { role: "assistant", content: answer.slice(0, 4000) }].slice(-16) });
    } catch (e) {
      if (e?.text) put("coach", { turns: [...turns, { role: "assistant", content: e.text }].slice(-16) });
      C.error = e?.code === "cancelled" ? "" : aiErr(e); aiGone(e);
    }
    C.busy = false; C.live = ""; C.ctl = null;
    if (state.tab === "coach") { render(); scrollChat(); }
  }

  async function getFits() {
    const C = state.coach;
    if (!state.sample || C.fitsBusy) return;
    const today = dayKey(), t = dayTotals(today), bud = budgetFor(today), pl = plan(profile());
    const left = Math.max(bud - t.kcal, 300), pLeft = Math.max(pl.protein - t.p, 0), greens = greensFor(today);
    C.fitsBusy = true; C.error = ""; C.fits = null; render();
    try {
      const res = await state.sample.json(`Suggest 3 realistic Ghanaian ${defaultMeal() === "Breakfast" ? "breakfast" : defaultMeal() === "Lunch" ? "lunch" : "dinner"} ideas for someone with about ${r(left)} kcal and ${r(pLeft)} g protein left today. They have had ${greens} of ${TARGETS.greens} servings of greens. Filter: ${C.fitsFilter === "All" ? "any" : C.fitsFilter === "Chop bar" ? "things you can buy at a chop bar or roadside" : C.fitsFilter === "Quick" ? "ready in 15 minutes" : "cooked at home"}.
Use only foods from this table, with grams for each:
${foodList()}
Each idea should use most of the remaining calories without going over. Tag one "Best fit", and others with a short reason like "Most protein" or "Most greens".
Reply with only JSON: {"ideas": [{"title": "Light soup with tilapia", "detail": "With a small ball of fufu", "tag": "Best fit", "items": [{"id": "lightsoup", "grams": 350}]}], "tip": "one short practical tip, e.g. for ordering at a chop bar"}`, { signal: (C.ctl = new AbortController()).signal });
      const ideas = (res?.ideas || []).slice(0, 4).map((idea) => {
        const items = (idea.items || []).map((x) => { const f = getFood(x.id); return f ? newItem(f, Math.max(5, Math.min(Number(x.grams) || f.portion, 2000))) : null; }).filter(Boolean);
        const tot = items.reduce((s, it) => { const c = itemCalc(it); return { kcal: s.kcal + c.kcal, p: s.p + c.p }; }, { kcal: 0, p: 0 });
        return { title: String(idea.title || "Idea").slice(0, 60), detail: String(idea.detail || "").slice(0, 100), tag: String(idea.tag || "").slice(0, 20), items, ...tot };
      }).filter((i) => i.items.length);
      C.fits = { left, ideas, tip: String(res?.tip || "").slice(0, 200) };
    } catch (e) { C.error = e?.code === "cancelled" ? "" : aiErr(e); aiGone(e); }
    C.fitsBusy = false; C.ctl = null;
    if (state.tab === "coach") render();
  }

  // Smart reminder: only for a meal you usually log, once its time has passed, if it isn't logged or skipped.
  function dueReminder() {
    const R = remind(), today = dayKey();
    if (!R.on || state.date !== today) return null;
    const d = dayDoc(today), now = nowMin();
    if (R.weighDay === new Date().getDay() && !weights().some((w) => w.date === today) && !(d.skipped || []).includes("weigh"))
      return { kind: "weigh" };
    for (const type of ["Dinner", "Lunch", "Breakfast"]) {
      const at = toMin(R[type]);
      if (now < at || now > at + 180) continue;
      if (d.meals.some((m) => m.type === type) || (d.skipped || []).includes(type)) continue;
      const usual = Array.from({ length: 7 }, (_, i) => shift(today, -1 - i)).filter((k) => dayDoc(k).meals.some((m) => m.type === type)).length;
      const anyHistory = Array.from({ length: 7 }, (_, i) => shift(today, -1 - i)).some((k) => dayDoc(k).meals.length);
      if (anyHistory && usual < 3) continue;
      return { kind: "meal", type, streak: mealStreak(type) };
    }
    return null;
  }

  function recentMeals() {
    const seen = new Set(), out = [];
    for (let i = 0; i < 10 && out.length < 4; i++) {
      for (const m of dayDoc(shift(dayKey(), -i)).meals.slice().reverse()) {
        const label = m.items.slice(0, 2).map((x) => x.name.split(" (")[0].split(",")[0]).join(" + ");
        if (!seen.has(label)) { seen.add(label); out.push({ label, meal: m }); }
        if (out.length >= 4) break;
      }
    }
    return out;
  }

    const m = state.lastMeal, k = state.date, t = dayTotals(k), bud = budgetFor(k), pl = plan(profile()), H = hide();
    const greens = greensFor(k), insights = [];
    if (m.p >= 20) insights.push(["ok", "+", "Good protein", `This meal brought you to ${r((t.p / pl.protein) * 100)}% of today's protein goal.`]);
    else if (m.p < 10) insights.push(["check", "!", "Light on protein", "An egg, fish, beans or chicken next time keeps you fuller for longer."]);

    if (greens < 1) insights.push(["check", "!", "Low on greens", "Add kontomire, garden eggs, okro or salad at your next meal for fibre."]);
    else if (m.items.some((i) => i.green)) insights.push(["ok", "+", "Greens counted", `${greens} of ${TARGETS.greens} servings today.`]);
    if (t.kcal > bud) insights.push(["plain", "i", "Over for today", "That's fine. One day doesn't change your weight; the weekly pattern does."]);
    const left = bud - t.kcal;
    return `<div class="stack">
      <div><p class="eyebrow">Meal saved</p><h1>${esc(m.type)} saved</h1><p class="muted">${H ? "" : `About ${fmt(m.kcal)} kcal · `}${esc(m.items.map((i) => i.name).join(", "))}</p></div>

              <button class="btn ghost sm" data-act="logIdea" data-id="${n}" style="justify-self:start">Log this meal</button></div>`).join("")}

  function weightChart(tr, goal) {
    const W = 340, H = 180, L = 34, Rr = 8, T = 12, B = 24;
    if (tr.length < 2) return `<p class="muted small">Log at least two weigh-ins to see your trend. Weigh yourself at the same time each day, ideally in the morning.</p>`;
    const pts = tr.slice(-60);
    const d0 = pts[0].date, span = Math.max(daysBetween(d0, pts[pts.length - 1].date), 1);
    const vals = pts.flatMap((p) => [p.kg, p.trend]).concat(goal ? [goal] : []);
    const lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
    const x = (d) => L + (daysBetween(d0, d) / span) * (W - L - Rr), y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const step = Math.max(1, Math.ceil((hi - lo) / 4));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">`;
    for (let v = lo; v <= hi; v += step) s += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
    if (goal && goal >= lo && goal <= hi) s += `<line x1="${L}" x2="${W - Rr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--mint-text)" stroke-dasharray="4 4"/><text x="${W - Rr}" y="${y(goal) - 4}" text-anchor="end" style="fill:var(--mint-text)">goal ${goal}</text>`;
    pts.forEach((p) => (s += `<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="3" fill="var(--muted)" opacity="0.45"/>`));
    s += `<polyline fill="none" stroke="var(--mint)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p) => `${x(p.date)},${y(p.trend)}`).join(" ")}"/>`;
    const last = pts[pts.length - 1];
    s += `<circle cx="${x(last.date)}" cy="${y(last.trend)}" r="5" fill="var(--mint)" stroke="var(--bg)" stroke-width="2"/>`;
    const fmtD = (k) => keyDate(k).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    s += `<text x="${L}" y="${H - 6}">${fmtD(d0)}</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end">${fmtD(last.date)}</text></svg>`;
    return s + `<p class="small muted">Dots are your weigh-ins; the line is your smoothed trend, which ignores day-to-day water swings of 1–2 kg.</p>`;
  }
  // Your week: the last 7 days as a short story.
  function weekStory() {
    const today = dayKey(), days = Array.from({ length: 7 }, (_, i) => shift(today, i - 6));
    const info = days.map((k) => ({ k, kcal: dayTotals(k).kcal, bud: budgetFor(k), n: dayDoc(k).meals.length, p: dayTotals(k).p }));
    const logged = info.filter((d) => d.n);
    if (!logged.length) return "";
    const meals = logged.reduce((s, d) => s + d.n, 0);
    const cls = (d) => (d.kcal > d.bud * 1.1 ? "over" : d.kcal >= d.bud * 0.9 ? "on" : "under");
    const color = { under: "var(--mint-tint)", on: "var(--mint)", over: "var(--sun)" };
    const counts = {};
    logged.forEach((d) => dayDoc(d.k).meals.forEach((m) => m.items.forEach((i) => { const n = i.name.split(" (")[0].split(",")[0]; counts[n] = (counts[n] || 0) + 1; })));
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    const best = logged.slice().sort((a, b) => Math.abs(a.kcal - a.bud) - Math.abs(b.kcal - b.bud))[0];
    const overDays = logged.filter((d) => cls(d) === "over");
    const weekendOver = overDays.length && overDays.every((d) => [0, 6].includes(keyDate(d.k).getDay()));
    const pl = plan(profile()), avgP = logged.reduce((s, d) => s + d.p, 0) / logged.length, wk = weeklyChange();
    const tip = weekendOver ? "Your over-budget days were weekends. Plan Saturday's meals on Friday, or ask the coach for a flex plan."
      : overDays.length >= 3 ? "Several days went over. Try logging before you eat, and ask for less oil on top at chop bars."
      : avgP < pl.protein * 0.7 ? "Protein was low most days. Add an egg, fish, beans or chicken to one more meal a day."
      : logged.length < 5 ? "Logging on more days gives you a truer picture. Try a quick snap at every meal next week."
      : "A steady week. Keep the same rhythm next week.";
    const W = 300, H = 90, slot = W / 7, bw = slot * 0.6, max = Math.max(...info.map((d) => Math.max(d.kcal, d.bud)), 1);
    let bars = `<svg viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="Calories by day compared with budget">`;
    info.forEach((d, i) => {
      const x = slot * i + (slot - bw) / 2, h = (d.kcal / max) * H;
      if (d.n) bars += `<rect x="${x}" y="${H - h}" width="${bw}" height="${Math.max(h, 2)}" rx="5" fill="${color[cls(d)]}" stroke="${cls(d) === "under" ? "var(--mint)" : "none"}"/>`;
      bars += `<text x="${x + bw / 2}" y="${H + 14}" text-anchor="middle">${WEEKDAYS[keyDate(d.k).getDay()][0]}</text>`;
    });
    bars += `</svg>`;
    return `<section class="card chart"><div><p class="eyebrow">${shortDay(days[0])} – ${shortDay(today)}</p><h2>Your week</h2></div>
      <div class="stats"><div class="stat"><span class="small muted">Meals logged</span><b class="num">${meals}</b><span class="small muted">on ${logged.length} of 7 days</span></div>
        <div class="stat"><span class="small muted">Top dish</span><b style="font-size:15px">${esc(top?.[0] || "–")}</b><span class="small muted">${top ? `${top[1]} time${top[1] > 1 ? "s" : ""}` : ""}</span></div>
        <div class="stat"><span class="small muted">Trend</span><b class="num">${wk == null ? "–" : (wk > 0 ? "+" : "") + r1(wk) + " kg"}</b><span class="small muted">per week</span></div></div>
      ${bars}
      <div class="legend"><span><i style="background:var(--mint-tint);border:1px solid var(--mint)"></i>Under</span><span><i style="background:var(--mint)"></i>Right on</span><span><i style="background:var(--sun)"></i>Over</span></div>
      <p class="small"><b>Best day:</b> ${WEEKDAYS[keyDate(best.k).getDay()]}, closest to budget.</p>
      <div class="good"><b>Try next week:</b> ${tip}</div></section>`;
  }
  function viewProgress() {
    const p = profile(), pl = plan(p), tr = ema(weights()), last = tr[tr.length - 1], weekly = weeklyChange();
    const learn = learnBurn();
    let learnCard = "";
    if (learn?.tdee) {
      const newPlan = plan(p, learn.tdee);
      const diff = Math.abs(newPlan.budget - pl.budget);
      learnCard = `<section class="card"><h2>Weekly check-in</h2>
        <p class="small">Over ${learn.span} days you ate about <b>${fmt(learn.avg)}</b> kcal a day on logged days, and your trend moved ${learn.change > 0 ? "+" : ""}${r1(learn.change)} kg. That means you burn about <b>${fmt(learn.tdee)} kcal a day</b> (our first guess was ${fmt(pl.guess)}).</p>
        ${diff >= 30 ? `<p class="small">To stay on your ${pl.pace} kg-a-week pace, your budget should be <b>${fmt(newPlan.budget)} kcal</b>.</p>` : `<p class="good">Your budget of ${fmt(pl.budget)} kcal is still right for your pace.</p>`}
        <div class="row wrap">${diff >= 30 ? `<button class="btn sm" data-act="useLearned" data-v="${r(learn.tdee)}">Use ${fmt(newPlan.budget)} kcal</button><button class="btn ghost sm" data-act="keepBudget">Keep ${fmt(pl.budget)}</button>` : ""}
        ${pl.lose ? `<button class="btn ghost sm" data-act="maintWeek" data-v="${r(learn.tdee)}">Take a maintenance week</button>` : ""}</div></section>`;
    } else if (learn?.need) learnCard = `<p class="small muted">PlateWise learns your real daily burn from your weigh-ins and logs. Still needed: ${learn.need}.</p>`;
    return `<div class="stack">
      <div><p class="eyebrow">Goal ${p.goal} kg · ${pl.pace} kg a week</p><h1>Progress</h1></div>
      <form class="card" id="weighForm"><b>Weigh in</b><div class="row">
        <input id="wKg" type="number" step="0.1" inputmode="decimal" placeholder="kg" aria-label="Weight in kilograms" style="flex:1">
        <input id="wDate" type="date" value="${dayKey()}" max="${dayKey()}" aria-label="Date" style="flex:1"></div>
        <button class="btn full" type="submit">Save weight</button></form>
      <div class="stats">
        <div class="stat"><span class="small muted">Trend now</span><b class="num">${last ? r1(last.trend) + " kg" : "–"}</b></div>
        <div class="stat"><span class="small muted">Per week</span><b class="num">${weekly == null ? "–" : (weekly > 0 ? "+" : "") + r1(weekly) + " kg"}</b></div>
        <div class="stat"><span class="small muted">To goal</span><b class="num">${r1(Math.abs((last ? last.trend : p.weight) - p.goal))} kg</b></div>
      </div>
      ${weekStory()}
      <section class="card chart"><h2>Weight trend</h2>${weightChart(tr, p.goal)}</section>
      ${learnCard}
      ${tr.length ? `<section class="card"><h2>Weigh-ins</h2><div class="list">${tr.slice().reverse().slice(0, 30).map((w) => `<div><span>${shortDay(w.date)}</span><span class="row"><b class="num">${w.kg} kg</b><button class="x-btn" data-act="delWeight" data-id="${w.date}" aria-label="Delete weigh-in">×</button></span></div>`).join("")}</div></section>` : ""}
    </div>`;
  }

  function viewGlance() {
    const k = dayKey(), t = dayTotals(k), pl = plan(profile()), bud = budgetFor(k), left = bud - t.kcal, H = hide();
    const next = ["Breakfast", "Lunch", "Dinner"].find((m) => !dayDoc(k).meals.some((x) => x.type === m)) || "Snack";
    return `<div class="stack"><div class="glance">
      <div class="ring-wrap">${ringBlock(k)}<div class="kv">
        <div><span class="small muted">Protein</span><b class="num">${H ? r((t.p / pl.protein) * 100) + "%" : `${r(t.p)} / ${pl.protein} g`}</b></div>
        <div><span class="small muted">Next</span><b>${next}</b></div></div></div>
      <button class="btn full" data-act="glanceSnap">Snap ${next.toLowerCase()}</button>
      ${left > 250 && state.sample && !H ? `<p class="small muted">Ideas that fit your last ${fmt(left)} kcal are one tap away in the Coach.</p>` : ""}
    </div><button class="btn ghost" data-act="exitGlance">Open the full app</button>
    <p class="small muted">This is the glance view. Pin it in Claude's sidebar to check your day in one tap.</p></div>`;
  }

  function viewMe() {
    const p = profile(), pl = plan(p), R = remind();
    const act = ACTIVITY.find((a) => a[0] === p.activity)?.[1] || "";
    const ov = Object.entries(overrides()).filter(([k]) => k >= dayKey()).sort();
    return `<div class="stack">
      <div><p class="eyebrow">Your plan</p><h1>Me</h1></div>
      <section class="card"><div class="row between"><b>Daily budget</b><b class="num" style="font-size:22px">${fmt(pl.budget)} kcal</b></div>
        <div class="list small">
          <div><span class="muted">Resting burn (BMR)</span><span class="num">${fmt(pl.bmr)} kcal</span></div>
          <div><span class="muted">Daily burn ${p.learnedTdee ? "(learned from your scale)" : `(${esc(act.toLowerCase())})`}</span><span class="num">${fmt(pl.tdee)} kcal</span></div>
          <div><span class="muted">Weight</span><span class="num">${p.weight} kg → ${p.goal} kg</span></div>
          <div><span class="muted">Pace</span><span>${pl.lose ? "−" + pl.pace + " kg a week" : pl.gain ? "+" + pl.pace + " kg a week" : "maintain"}</span></div>
          <div><span class="muted">Targets</span><span class="num">P ${pl.protein} g · C ${pl.carbs} g · F ${pl.fat} g</span></div>
        </div>
        ${pl.floored ? `<p class="notice">Your budget is held at the ${fmt(pl.floor)} kcal safety floor.</p>` : ""}
        ${p.learnedTdee ? `<button class="btn ghost sm" data-act="resetLearned" style="justify-self:start">Go back to the formula estimate</button>` : ""}
        <button class="btn" data-act="editProfile">Edit details and goal</button></section>
      ${ov.length ? `<section class="card"><b>Planned days</b><div class="list small">${ov.map(([k, o]) => `<div><span>${shortDay(k)} · ${esc(o.reason || "")}</span><b class="num">${fmt(o.kcal)} kcal</b></div>`).join("")}</div><button class="btn ghost sm" data-act="clearPlans" style="justify-self:start">Clear planned days</button></section>` : ""}
      <section class="card"><b>Reminders</b>
        <label class="switch">Remind me to log meals and weigh in<input type="checkbox" id="rOn" ${R.on ? "checked" : ""}></label>
        <div class="grid3">${["Breakfast", "Lunch", "Dinner"].map((m) => `<label class="field">${m}<input type="time" id="r${m}" value="${R[m]}"></label>`).join("")}</div>
        <label class="field">Weigh-in day<select id="rWeigh">${WEEKDAYS.map((d, i) => `<option value="${i}"${R.weighDay === i ? " selected" : ""}>${d}</option>`).join("")}</select></label>
        <p class="small muted">Reminders show at the top of Today when PlateWise is open, and only for meals you usually log. Web pages inside Claude can't send phone notifications.</p></section>
      <section class="card"><b>Glance view</b><p class="small muted">A widget-style view: calories left, protein, and a Snap button.</p><button class="btn ghost sm" data-act="openGlance" style="justify-self:start">Open glance view</button></section>
      <section class="card"><label class="switch">Hide calorie numbers<input type="checkbox" id="hideNums" ${p.hideNumbers ? "checked" : ""}></label><p class="small muted">Shows your progress with words and the ring instead of numbers. Helpful if numbers make food stressful.</p></section>
      <section class="card"><b>How PlateWise counts</b>
        <p class="small muted">Claude names each food and estimates the grams. Calories come from a food table built on USDA and FAO West Africa data, not from the AI. Expect photo estimates to be off by about 20% either way; your weekly weigh-ins correct for that over time.</p></section>
      <section class="card"><b>Your data</b>
        <p class="small muted">${store.mode === "db" ? "Your log is stored privately in your Claude account. Nobody else who opens this page can see it." : "Your log is stored in this browser only."} Meal photos are never stored.</p>
        ${state.confirmDelete ? `<p class="err">Delete every meal, weigh-in, chat and your profile? This can't be undone.</p><div class="row"><button class="btn ghost sm" data-act="cancelDelete">Keep my data</button><button class="btn danger sm" data-act="deleteAll">Delete everything</button></div>`
          : `<button class="btn danger sm" data-act="askDelete" style="justify-self:start">Delete all my data</button>`}</section>
    </div>`;
  }

  // ---------- actions ----------
  function saveMeal() {
    const R = state.review, t = reviewTotals();
    const meal = {
      id: uid(), type: R.meal, time: new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }), min: nowMin(), source: R.source, oil: R.oil,
      kcal: r(t.kcal), p: r1(t.p), c: r1(t.c), f: r1(t.f),
      items: R.items.map((it) => { const c = itemCalc(it, R.oil); return { name: it.name, fid: it.fid, grams: it.grams, aiGrams: it.aiGrams, per: it.per, oily: !!it.oily, green: !!it.green, conf: it.conf, corrected: it.grams !== it.aiGrams || !!it.swapped, kcal: r(c.kcal), unit: it.unit || "", portion: it.portion || 0 }; }),
    };
    const k = state.date;
    putDay(k, { meals: [...dayDoc(k).meals, meal] });
    if (R.fav) put("saved", { meals: [{ id: uid(), name: R.favName.trim() || meal.items.map((i) => i.name).join(", ").slice(0, 60), kcal: meal.kcal, items: meal.items, oil: R.oil }, ...saved()].slice(0, 50) });
    state.review = null; state.lastMeal = meal;
    state.log = { ...state.log, file: null, preview: null, note: "", text: "", q: "", error: "", bfile: null, bpreview: null, product: null };
    state.tab = "saved"; render(); window.scrollTo(0, 0);
  }
  function repeatYesterday(type) {
    const y = dayDoc(shift(state.date, -1)).meals.filter((m) => m.type === type).map((m) => ({ ...m, id: uid(), time: new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }), min: nowMin() }));
    if (!y.length) return;
    putDay(state.date, { meals: [...dayDoc(state.date).meals, ...y] });
    state.tab = "today"; render(); toast(`Logged ${type.toLowerCase()} from yesterday`);
  }
  function setGlance(on) {
    state.glance = on;
    try { if (on) location.hash = "glance"; else history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => { state.glance = location.hash === "#glance"; render(); });

  document.addEventListener("click", (e) => {
    const tab = e.target.closest("#tabs [data-tab]");
    if (tab) {
      if (state.scan) { state.scan.ctl.abort(); state.scan = null; }
      state.tab = tab.dataset.tab; state.review = null; state.confirmDelete = false;
      if (state.tab === "log" && state.date === dayKey()) state.log.meal = defaultMeal();
      render(); window.scrollTo(0, 0); if (state.tab === "coach") scrollChat(); return;
    }
    const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.type === "range") return;
    const id = b.dataset.id, act = b.dataset.act, L = state.log, C = state.coach;
    switch (act) {
      case "prevDay": state.date = shift(state.date, -1); render(); break;
      case "nextDay": if (state.date < dayKey()) { state.date = shift(state.date, 1); render(); } break;
      case "goLog": state.tab = "log"; render(); window.scrollTo(0, 0); break;
      case "goToday": state.tab = "today"; render(); window.scrollTo(0, 0); break;
      case "goFits": state.date = dayKey(); state.tab = "coach"; C.mode = "fits"; render(); window.scrollTo(0, 0); if (!C.fits) getFits(); break;
      case "goWeigh": state.tab = "progress"; render(); $("#wKg")?.focus(); break;
      case "snapFor": L.meal = id; L.mode = state.canImages ? "photo" : L.mode; state.tab = "log"; render(); window.scrollTo(0, 0); break;
      case "repeatMeal": repeatYesterday(id); break;
      case "skipRemind": putDay(dayKey(), { skipped: [...(dayDoc(dayKey()).skipped || []), id] }); render(); break;
      case "habit": { const d = dayDoc(state.date), h = { ...(d.habits || {}) }; h[id] = Math.max(0, (h[id] || 0) + Number(b.dataset.v)); if (id === "greens" && greensFor(state.date) + Number(b.dataset.v) < 0) break; putDay(state.date, { habits: h }); render(); break; }
      case "delMeal": { const d = dayDoc(state.date); const m = d.meals.find((x) => x.id === id); putDay(state.date, { meals: d.meals.filter((x) => x.id !== id) }); render(); if (m) toast(`Deleted ${m.type.toLowerCase()}`); break; }
      case "sameAsYesterday": { const y = dayDoc(shift(state.date, -1)).meals.map((m) => ({ ...m, id: uid() })); putDay(state.date, { meals: y }); render(); toast(`Copied ${y.length} meal${y.length > 1 ? "s" : ""} from the day before`); break; }
      case "recent": { const m = recentMeals()[Number(id)]?.meal; if (m) { openReview(fromSaved(m.items), "saved", ""); state.review.oil = m.oil || "normal"; render(); } break; }
      case "mode": L.mode = id; L.error = ""; if (recog) try { recog.abort(); } catch (er) {} render(); break;
      case "lang": L.lang = id; render(); break;
      case "listen": startListening(); break;
      case "stopListen": try { recog?.stop(); } catch (er) {} L.listening = false; render(); break;
      case "clearPhoto": L.file = null; L.preview = null; render(); break;
      case "scanPhoto": runScan("photo"); break;
      case "scanText": runScan("text"); break;
      case "scanVoice": runScan("voice"); break;
      case "scanBarcode": scanPackage(); break;
      case "manualProduct": L.product = { code: "", name: "", kcal: "", p: "", c: "", f: "", serving: 100 }; L.error = ""; render(); break;
      case "cancelProduct": L.product = null; L.bfile = null; L.bpreview = null; render(); break;
      case "saveProduct": {
        const n = (s) => Math.max(0, parseFloat($(s).value) || 0);
        const name = $("#prName").value.trim(), kcal = n("#prK"), serving = n("#prS") || 100, code = $("#prCode").value.replace(/\D/g, "");
        if (!name || !kcal) { L.error = "Enter at least the product name and calories per 100 g."; render(); break; }
        const key = code || uid();
        const prod = { name: name.slice(0, 60), per: [kcal, n("#prP"), n("#prC"), n("#prF")], serving, unit: L.product.unit || "1 serving", code };
        put("products", { items: { ...products(), [key]: prod } });
        L.product = null; L.bfile = null; L.bpreview = null;
        openReview([newItem({ id: "p:" + key, name: prod.name, per: prod.per, portion: serving, unit: prod.unit, oily: false, green: false }, serving)], "barcode", "");
        break;
      }
      case "stopScan": state.scan?.ctl.abort(); state.scan = null; render(); break;
      case "pickFood": { const f = getFood(id); if (f) openReview([newItem(f, f.portion)], "search", ""); break; }
      case "useSaved": { const m = saved().find((x) => x.id === id); if (m) { openReview(fromSaved(m.items), "saved", ""); state.review.oil = m.oil || "normal"; render(); } break; }
      case "delSaved": put("saved", { meals: saved().filter((x) => x.id !== id) }); render(); break;
      case "cancelReview": state.review = null; state.tab = "log"; render(); break;
      case "rmItem": state.review.items = state.review.items.filter((i) => i.key !== b.dataset.key); render(); break;
      case "addItem": { const f = getFood(id); if (f) state.review.items.push(newItem(f, f.portion)); state.review.q = ""; render(); break; }
      case "oil": state.review.oil = id; render(); break;
      case "saveMeal": saveMeal(); break;
      case "coachMode": C.mode = id; C.error = ""; render(); if (id === "fits" && !C.fits) getFits(); break;
      case "fitsFilter": C.fitsFilter = id; getFits(); break;
      case "getFits": getFits(); break;
      case "logIdea": { const idea = C.fits?.ideas[Number(id)]; if (idea) { state.date = dayKey(); state.log.meal = defaultMeal(); openReview(idea.items.map((i) => ({ ...i, key: uid() })), "search", idea.title); } break; }
      case "ask": state.tab = "coach"; C.mode = "chat"; sendCoach(id); break;
      case "stopCoach": C.ctl?.abort(); break;
      case "clearChat": put("coach", null); C.pending = null; C.error = ""; render(); break;
      case "savePlan": {
        const days = { ...overrides() };
        C.pending.days.forEach((d) => (days[d.date] = { kcal: d.kcal, reason: C.pending.reason }));
        put("plans", { days }); C.pending = null; render(); toast("Flex plan saved"); break;
      }
      case "dropPlan": C.pending = null; render(); break;
      case "clearPlans": put("plans", null); render(); toast("Planned days cleared"); break;
      case "maintWeek": {
        const days = { ...overrides() }, kcal = Math.round(Number(b.dataset.v) / 10) * 10;
        for (let i = 0; i < 7; i++) days[shift(dayKey(), i)] = { kcal, reason: "Maintenance week" };
        put("plans", { days }); render(); toast(`Maintenance week: ${fmt(kcal)} kcal a day for 7 days`); break;
      }
      case "useLearned": { put("profile", { ...profile(), learnedTdee: Number(b.dataset.v) }); render(); toast(`Budget updated to ${fmt(plan(profile()).budget)} kcal`); break; }
      case "keepBudget": toast("Budget kept"); break;
      case "resetLearned": { const { learnedTdee, ...p } = profile(); put("profile", p); render(); break; }
      case "delWeight": put("weights", { entries: weights().filter((w) => w.date !== id) }); render(); break;
      case "editProfile": state.editingProfile = true; render(); window.scrollTo(0, 0); break;
      case "cancelProfile": state.editingProfile = false; render(); break;
      case "openGlance": setGlance(true); break;
      case "exitGlance": setGlance(false); break;
      case "glanceSnap": { const k = dayKey(); state.date = k; L.meal = ["Breakfast", "Lunch", "Dinner"].find((m) => !dayDoc(k).meals.some((x) => x.type === m)) || "Snack"; state.tab = "log"; setGlance(false); break; }
      case "askDelete": state.confirmDelete = true; render(); break;
      case "cancelDelete": state.confirmDelete = false; render(); break;
      case "deleteAll": Object.keys(state.docs).forEach((k) => put(k, null)); state.confirmDelete = false; state.tab = "today"; C.pending = null; render(); toast("All your data was deleted"); break;
    }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "logNote") state.log.note = t.value;
    else if (t.id === "logText") { state.log.text = t.value; const btn = $('[data-act="scanText"]') || $('[data-act="scanVoice"]'); if (btn) btn.disabled = !t.value.trim(); }
    else if (t.id === "logQ") { state.log.q = t.value; const pos = t.selectionStart; render(); const n = $("#logQ"); n.focus(); n.setSelectionRange(pos, pos); }
    else if (t.id === "revQ") { state.review.q = t.value; const pos = t.selectionStart; render(); const n = $("#revQ"); n.focus(); n.setSelectionRange(pos, pos); }
    else if (t.id === "revFavName") state.review.favName = t.value;
    else if (t.dataset.act === "grams") {
      const it = state.review.items.find((i) => i.key === t.dataset.key); if (!it) return;
      it.grams = Number(t.value);
      const row = t.closest(".item"); $(".g", row).textContent = it.grams; $(".pt", row).innerHTML = portionsText(it);
      const k = $(".k", row); if (k) k.textContent = `${fmt(itemCalc(it, state.review.oil).kcal)} kcal`;
      refreshReviewNumbers();
    } else if (t.closest("#profileForm")) updateProfilePreview();
  });

  document.addEventListener("change", (e) => {
    const t = e.target, L = state.log;
    if (t.id === "photoIn" && t.files?.[0]) {
      if (L.preview) URL.revokeObjectURL(L.preview);
      L.file = t.files[0]; L.preview = URL.createObjectURL(L.file); L.error = ""; render();
    } else if (t.id === "barIn" && t.files?.[0]) {
      if (L.bpreview) URL.revokeObjectURL(L.bpreview);
      L.bfile = t.files[0]; L.bpreview = URL.createObjectURL(L.bfile); L.error = ""; render();
    } else if (t.id === "logMeal") L.meal = t.value;
    else if (t.id === "revMeal") state.review.meal = t.value;
    else if (t.id === "revFav") { state.review.fav = t.checked; $("#revFavName").hidden = !t.checked; }
    else if (t.id === "steps") { const d = dayDoc(state.date); putDay(state.date, { habits: { ...(d.habits || {}), steps: Math.max(0, parseInt(t.value, 10) || 0) } }); setTimeout(render); }
    else if (t.id === "hideNums") { put("profile", { ...profile(), hideNumbers: t.checked }); render(); }
    else if (["rOn", "rBreakfast", "rLunch", "rDinner", "rWeigh"].includes(t.id)) {
      const R = { on: $("#rOn").checked, Breakfast: $("#rBreakfast").value || DEFAULT_REMIND.Breakfast, Lunch: $("#rLunch").value || DEFAULT_REMIND.Lunch, Dinner: $("#rDinner").value || DEFAULT_REMIND.Dinner, weighDay: Number($("#rWeigh").value) };
      put("profile", { ...profile(), remind: R }); toast("Reminders saved");
    } else if (t.dataset.act === "swap" && t.value) {
      const it = state.review.items.find((i) => i.key === t.dataset.key), f = getFood(t.value);
      Object.assign(it, { fid: f.id, name: f.name, per: f.per, oily: f.oily, green: f.green, unit: f.unit, portion: f.portion, aiPer: false, swapped: true, conf: "high" });
      render();
    } else if (t.closest("#profileForm")) updateProfilePreview();
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.id === "coachIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#coachForm").requestSubmit(); }
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "profileForm") {
      const p = readProfileForm(), err = validateProfile(p);
      const box = $("#pErr");
      if (err) { box.textContent = err; box.hidden = false; return; }
      const old = profile();
      const keepLearned = old?.learnedTdee && old.weight === p.weight && old.activity === p.activity;
      const { learnedTdee, ...rest } = old || {};
      const next = { ...rest, ...p, ...(keepLearned ? { learnedTdee: old.learnedTdee } : {}), start: old?.start || p.weight, startDate: old?.startDate || dayKey() };
      put("profile", next);
      if (!old && !weights().length) put("weights", { entries: [{ date: dayKey(), kg: p.weight }] });
      state.editingProfile = false; state.tab = "today"; render(); window.scrollTo(0, 0);
      toast(old ? "Details saved" : `Your budget is ${fmt(plan(next).budget)} kcal a day`);
    } else if (e.target.id === "weighForm") {
      const kg = parseFloat($("#wKg").value), date = $("#wDate").value || dayKey();
      if (!(kg >= 30 && kg <= 300)) { toast("Enter your weight in kilograms"); return; }
      put("weights", { entries: [...weights().filter((w) => w.date !== date), { date, kg: r1(kg) }] });
      render(); toast(`Saved ${r1(kg)} kg`);
    } else if (e.target.id === "coachForm") {
      const v = $("#coachIn").value; if (v.trim()) sendCoach(v);
    }
  });

  render();
  connect();
})();
</script>

</body>
</html>
